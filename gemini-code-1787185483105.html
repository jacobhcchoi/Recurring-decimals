<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Vault Cracker: Repeating Decimals</title>
  <style>
    :root {
      --bg-color: #121826;
      --card-bg: #1f293d;
      --accent: #00d26a;
      --accent-alt: #00f2fe;
      --text: #f0f4f8;
      --text-dim: #94a3b8;
      --error: #ff4757;
      --warning: #f1c40f;
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
    }

    .game-container {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 20px 16px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: clamp(1.4rem, 5vw, 1.8rem);
      background: linear-gradient(45deg, var(--accent), var(--accent-alt));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      font-weight: bold;
      background: rgba(0,0,0,0.25);
      padding: 10px;
      border-radius: 12px;
    }

    .hud-timer {
      color: var(--warning);
      font-family: monospace;
    }

    .hud-pts {
      color: var(--accent);
    }

    .vault-display {
      background: rgba(0,0,0,0.3);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 2px dashed rgba(255,255,255,0.2);
    }

    .decimal {
      font-size: clamp(2rem, 8vw, 2.5rem);
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--accent-alt);
    }

    .repeating {
      text-decoration: overline;
    }

    .step-section {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: left;
    }

    .step-title {
      font-size: 0.8rem;
      color: var(--accent-alt);
      text-transform: uppercase;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .multiplier-selects {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    select, .fixed-select {
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      padding: 10px 14px;
      min-height: 48px;
      outline: none;
    }

    select {
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
    }

    .fixed-select {
      background: rgba(255,255,255,0.03);
      color: var(--text-dim);
      border-color: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .live-preview {
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      padding: 10px;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(0.85rem, 3.5vw, 1rem);
      line-height: 1.5;
      color: var(--accent-alt);
      border-left: 3px solid var(--accent);
      overflow-x: auto;
    }

    .eq-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin: 2px 0;
      white-space: nowrap;
    }

    .eq-var {
      width: 65px;
      text-align: right;
    }

    .eq-equals {
      width: 20px;
      text-align: center;
    }

    .eq-int {
      width: 45px;
      text-align: right;
    }

    .eq-dec {
      text-align: left;
    }

    .sub-result {
      color: var(--accent);
      font-weight: bold;
      background: rgba(0, 210, 106, 0.1);
      padding: 6px 10px;
      border-radius: 4px;
      margin-top: 6px;
      font-size: 0.9rem;
    }

    .sub-error {
      color: var(--error);
      font-weight: bold;
      background: rgba(255, 71, 87, 0.1);
      padding: 6px 10px;
      border-radius: 4px;
      margin-top: 6px;
      font-size: 0.9rem;
    }

    .input-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .fraction-block {
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.3s ease-in-out;
    }

    .fraction-input {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    input[type="number"] {
      width: 75px;
      height: 48px;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 1.2rem;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
    }

    input[type="number"]:disabled {
      background: rgba(255,255,255,0.02);
      border-color: rgba(255,255,255,0.1);
      color: var(--text-dim);
    }

    .fraction-line {
      width: 75px;
      height: 3px;
      background-color: var(--text);
      border-radius: 2px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    button {
      background: linear-gradient(45deg, var(--accent), #00b894);
      border: none;
      color: #121826;
      font-weight: bold;
      font-size: 1rem;
      padding: 14px 20px;
      min-height: 48px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    .submit-btn {
      margin-top: 15px;
      display: block;
    }

    .toggle-btn {
      background: transparent;
      border: 1px solid var(--text-dim);
      color: var(--text-dim);
      font-size: 0.85rem;
      padding: 10px 14px;
      min-height: 40px;
      margin-top: 12px;
      width: auto;
      display: none; /* Hidden by default for first 20 seconds */
    }

    .toggle-btn:hover {
      color: var(--text);
      border-color: var(--text);
    }

    .steps-card {
      display: none;
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      text-align: left;
      font-family: monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      border-left: 3px solid var(--accent-alt);
    }

    .feedback {
      margin-top: 12px;
      min-height: 24px;
      font-weight: bold;
      line-height: 1.4;
      font-size: 0.95rem;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 12px;
    }

    #step-2 {
      display: none;
    }

    @media (min-width: 480px) {
      .hud {
        grid-template-columns: repeat(4, 1fr);
      }
      .game-container {
        padding: 30px;
      }
    }
  </style>
</head>
<body>

<div class="game-container">
  <h1>Vault Cracker</h1>
  
  <div class="hud">
    <span>Score: <span id="score">0</span>/50</span>
    <span>⏱️ <span class="hud-timer" id="timer-display">0s</span></span>
    <span>⭐ <span class="hud-pts" id="potential-pts">+10 pts</span></span>
    <span>Vault: <span id="vault-num">1</span>/5</span>
  </div>

  <div class="vault-display">
    <div style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 4px; letter-spacing: 1px;">TARGET VAULT CODE</div>
    <div class="decimal" id="decimal-target">0.9<span class="repeating">36</span></div>
  </div>

  <!-- STEP 1: Multipliers -->
  <div class="step-section">
    <div class="step-title">Step 1: Choose Correct Multiplier</div>
    <div class="multiplier-selects">
      <select id="m1" onchange="onMultiplierChange()">
        <option value="1">1x</option>
        <option value="10">10x</option>
        <option value="100">100x</option>
        <option value="1000">1000x</option>
        <option value="10000">10000x</option>
      </select>
      <span>−</span>
      <div class="fixed-select">1x</div>
    </div>

    <!-- Live Output Preview -->
    <div class="live-preview" id="live-preview">
      Select a multiplier to align tails...
    </div>
  </div>

  <!-- STEP 2: Fraction Output -->
  <div class="step-section" id="step-2">
    <div class="step-title">Step 2: Solve for x</div>
    <div class="input-group" id="input-group">
      <span style="font-size: 1.3rem; font-weight: bold;">x = </span>
      
      <!-- Initial Fraction Block -->
      <div class="fraction-block" id="block-0">
        <div class="fraction-input">
          <input type="number" inputmode="numeric" step="any" id="num-0" placeholder="Num" />
          <div class="fraction-line" id="line-0"></div>
          <input type="number" inputmode="numeric" step="any" id="den-0" placeholder="Den" />
        </div>
      </div>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="checkAnswer()">Crack Vault 🔓</button>
  </div>

  <div class="feedback" id="feedback"></div>

  <!-- Toggle button is hidden until 20 seconds elapse -->
  <button class="toggle-btn" id="toggle-btn" onclick="toggleSteps()">💡 Show Algebraic Proof</button>
  <div class="steps-card" id="steps-card"></div>

  <div class="hint" id="hint">Tip: Pick the multiplier that forces the repeating bar to line up with 1x!</div>
</div>

<script>
  function gcd(a, b) {
    return b === 0 ? a : gcd(b, a % b);
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateValidRepStr(length) {
    if (length === 1) return String(randInt(1, 9));
    
    while (true) {
      let minVal = Math.pow(10, length - 1);
      let maxVal = Math.pow(10, length) - 1;
      let valStr = String(randInt(minVal, maxVal));

      let allSame = valStr.split('').every(c => c === valStr[0]);
      if (allSame) continue;

      if (length === 4 && valStr.substring(0,2) === valStr.substring(2)) continue;

      return valStr;
    }
  }

  function getAlignedComponents(m, nonRepStr, repStr) {
    let shift = Math.round(Math.log10(m));
    let k = nonRepStr.length;
    let p = repStr.length;
    let fullSeq = nonRepStr + repStr.repeat(25);

    let integerPart = "0";
    if (shift > 0) {
      integerPart = fullSeq.substring(0, shift);
    }

    let decNonRepPart = fullSeq.substring(shift, shift + k);
    let offset = shift % p;
    let shiftedRepStr = repStr.substring(offset) + repStr.substring(0, offset);

    return {
      intPart: integerPart,
      decPart: decNonRepPart + `<span class="repeating">${shiftedRepStr}</span>...`
    };
  }

  function generateProblem() {
    const types = ['1rep', '2rep', '3rep', '1non1rep', '1non2rep'];
    const chosenType = types[randInt(0, types.length - 1)];

    let nonRepStr = "";
    let repStr = "";

    if (chosenType === '1rep') {
      repStr = generateValidRepStr(1);
    } else if (chosenType === '2rep') {
      repStr = generateValidRepStr(2);
    } else if (chosenType === '3rep') {
      repStr = generateValidRepStr(3);
    } else if (chosenType === '1non1rep') {
      nonRepStr = String(randInt(1, 9));
      repStr = generateValidRepStr(1);
    } else if (chosenType === '1non2rep') {
      nonRepStr = String(randInt(1, 9));
      repStr = generateValidRepStr(2);
    }

    let minTargetM1 = Math.pow(10, repStr.length);

    let exactRawNum = (parseInt(nonRepStr + repStr) || 0) - (parseInt(nonRepStr) || 0);
    let exactRawDen = (Math.pow(10, repStr.length) - 1) * Math.pow(10, nonRepStr.length);

    const commonFactor = gcd(exactRawNum, exactRawDen);
    const simplifiedNum = exactRawNum / commonFactor;
    const simplifiedDen = exactRawDen / commonFactor;
    const needsSimplification = commonFactor > 1;

    let displayHTML = "0.";
    if (nonRepStr !== "") displayHTML += nonRepStr;
    displayHTML += `<span class="repeating">${repStr}</span>`;

    const getComp = (m) => getAlignedComponents(m, nonRepStr, repStr);

    let diffCoeff = minTargetM1 - 1;
    let rawDiffFormatted = (exactRawNum / Math.pow(10, nonRepStr.length)).toFixed(nonRepStr.length || 0);

    const steps = [
      `1. Let x = 0.${nonRepStr}${repStr}${repStr}...`,
      `2. Multiplier: ${minTargetM1}x`,
      `3. Subtraction: ${diffCoeff}x = ${rawDiffFormatted}`,
      `4. Raw Fraction: x = ${exactRawNum}/${exactRawDen}`,
      `5. Simplified (÷${commonFactor}): x = ${simplifiedNum}/${simplifiedDen}`
    ];

    return {
      display: displayHTML,
      nonRepStr: nonRepStr,
      repStr: repStr,
      minM1: minTargetM1,
      m2: 1,
      rawNum: exactRawNum,
      rawDen: exactRawDen,
      num: simplifiedNum,
      den: simplifiedDen,
      needsSimplification: needsSimplification,
      getComp: getComp,
      steps: steps
    };
  }

  let currentProblem = null;
  let currentVault = 0;
  let score = 0;
  let fractionIndex = 0; 
  let startTime = null;
  let timerInterval = null;

  function calculateBasePoints(elapsedSeconds) {
    let basePts = 10;
    if (elapsedSeconds > 15) {
      let extraTime = elapsedSeconds - 15;
      let penalty = Math.floor(extraTime / 2);
      basePts = Math.max(1, 10 - penalty);
    }
    return basePts;
  }

  function startTimer() {
    startTime = Date.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      let elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
      
      // Reveal algebraic proof button after 20 seconds
      if (elapsedSeconds >= 20) {
        document.getElementById('toggle-btn').style.display = "inline-block";
      }

      if (elapsedSeconds >= 35) {
        stopTimer();
        handleTimeout();
        return;
      }

      let basePts = calculateBasePoints(elapsedSeconds);
      document.getElementById('timer-display').innerText = elapsedSeconds + "s";
      document.getElementById('potential-pts').innerText = "+" + basePts + " pts";
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    return Math.floor((Date.now() - startTime) / 1000);
  }

  function handleTimeout() {
    const feedback = document.getElementById('feedback');
    feedback.style.color = "var(--error)";
    feedback.innerText = "❌ Time's up (>35s)! Moving to next vault...";

    document.getElementById('submit-btn').style.display = "none";
    document.getElementById('m1').disabled = true;
    let inputs = document.querySelectorAll('input[type="number"]');
    inputs.forEach(input => input.disabled = true);

    nextStep();
  }

  function loadVault() {
    currentProblem = generateProblem();
    fractionIndex = 0;
    
    document.getElementById('decimal-target').innerHTML = currentProblem.display;
    document.getElementById('vault-num').innerText = currentVault + 1;
    
    document.getElementById('m1').value = "1";
    document.getElementById('m1').disabled = false;
    
    document.getElementById('step-2').style.display = "none";

    const submitBtn = document.getElementById('submit-btn');
    submitBtn.style.display = "block";
    
    const inputGroup = document.getElementById('input-group');
    inputGroup.innerHTML = `
      <span style="font-size: 1.3rem; font-weight: bold;">x = </span>
      <div class="fraction-block" id="block-0">
        <div class="fraction-input">
          <input type="number" inputmode="numeric" step="any" id="num-0" placeholder="Num" />
          <div class="fraction-line" id="line-0"></div>
          <input type="number" inputmode="numeric" step="any" id="den-0" placeholder="Den" />
        </div>
      </div>
    `;

    document.getElementById('feedback').innerText = '';
    document.getElementById('potential-pts').innerText = "+10 pts";
    document.getElementById('timer-display').innerText = "0s";
    
    // Reset toggle button visibility for the new round
    const toggleBtn = document.getElementById('toggle-btn');
    toggleBtn.style.display = "none";

    const stepsCard = document.getElementById('steps-card');
    stepsCard.style.display = "none";
    stepsCard.innerHTML = currentProblem.steps.join("<br>");

    onMultiplierChange();
    startTimer();
  }

  function onMultiplierChange() {
    const m1Val = parseInt(document.getElementById('m1').value);
    updateLivePreview(m1Val);

    const feedback = document.getElementById('feedback');

    if (m1Val === currentProblem.minM1) {
      feedback.style.color = "var(--accent)";
      feedback.innerText = "✅ Multiplier correct! Solve for x.";
      document.getElementById('step-2').style.display = "block";
    } else {
      document.getElementById('step-2').style.display = "none";
      if (m1Val === 1) {
        feedback.innerText = "";
      } else {
        feedback.style.color = "var(--error)";
        feedback.innerText = `❌ ${m1Val}x does not align tails! Try another.`;
      }
    }
  }

  function updateLivePreview(m1Val) {
    const eq1 = currentProblem.getComp(m1Val);
    const eq2 = currentProblem.getComp(1);
    const diffCoeff = m1Val - 1;

    let html = `
      <div class="eq-row">
        <div class="eq-var">${m1Val}x</div>
        <div class="eq-equals">=</div>
        <div class="eq-int">${eq1.intPart}.</div>
        <div class="eq-dec">${eq1.decPart}</div>
      </div>
      <div class="eq-row">
        <div class="eq-var">1x</div>
        <div class="eq-equals">=</div>
        <div class="eq-int">${eq2.intPart}.</div>
        <div class="eq-dec">${eq2.decPart}</div>
      </div>
      <hr style="border: 0; border-top: 1px dashed rgba(255,255,255,0.2); margin: 6px 0;">
    `;
    
    if (diffCoeff > 0) {
      if (m1Val === currentProblem.minM1) {
        let formattedDiff = (currentProblem.rawNum / Math.pow(10, currentProblem.nonRepStr.length)).toFixed(currentProblem.nonRepStr.length || 0);
        html += `<div class="sub-result">➔ Subtraction: ${diffCoeff}x = ${formattedDiff}</div>`;
      } else {
        html += `<div class="sub-error">❌ Tails don't align!</div>`;
      }
    } else {
      html += `<div style="color:var(--text-dim); font-size: 0.85rem;">Select a multiplier to preview algebra.</div>`;
    }

    document.getElementById('live-preview').innerHTML = html;
  }

  function toggleSteps() {
    const card = document.getElementById('steps-card');
    card.style.display = (card.style.display === "block") ? "none" : "block";
  }

  function addNextFractionBlock(type) {
    fractionIndex++;
    const nextIdx = fractionIndex;

    const inputGroup = document.getElementById('input-group');
    const newBlock = document.createElement('div');
    newBlock.className = 'fraction-block';
    newBlock.id = `block-${nextIdx}`;

    const accentColor = (type === "decimal") ? "var(--warning)" : "var(--accent-alt)";

    newBlock.innerHTML = `
      <span style="font-size: 1.3rem; font-weight: bold; color: ${accentColor};">=</span>
      <div class="fraction-input">
        <input type="number" inputmode="numeric" step="any" id="num-${nextIdx}" placeholder="Num" />
        <div class="fraction-line" id="line-${nextIdx}" style="background-color: ${accentColor};"></div>
        <input type="number" inputmode="numeric" step="any" id="den-${nextIdx}" placeholder="Den" />
      </div>
    `;

    inputGroup.appendChild(newBlock);
  }

  function checkAnswer() {
    const feedback = document.getElementById('feedback');
    const numInput = document.getElementById(`num-${fractionIndex}`);
    const denInput = document.getElementById(`den-${fractionIndex}`);

    const userNum = parseFloat(numInput.value);
    const userDen = parseFloat(denInput.value);

    if (isNaN(userNum) || isNaN(userDen)) {
      feedback.style.color = "var(--error)";
      feedback.innerText = "❌ Please enter numerator and denominator!";
      return;
    }

    if (!Number.isInteger(userNum) || !Number.isInteger(userDen)) {
      feedback.style.color = "var(--warning)";
      feedback.innerText = `⚠️ No decimals allowed in fractions! Clear decimal in new fraction:`;
      
      numInput.disabled = true;
      denInput.disabled = true;
      
      addNextFractionBlock("decimal");
      return;
    }

    const targetValue = currentProblem.num / currentProblem.den;
    const userValue = userNum / userDen;
    
    if (Math.abs(targetValue - userValue) > 0.00001) {
      feedback.style.color = "var(--error)";
      feedback.innerText = "❌ Incorrect value. Try again!";
      return;
    }

    const currentGcd = gcd(Math.abs(userNum), Math.abs(userDen));
    
    if (currentGcd > 1) {
      feedback.style.color = "var(--warning)";
      feedback.innerText = `💡 ${userNum}/${userDen} is correct, but reduce further (÷ by ${currentGcd})!`;
      
      numInput.disabled = true;
      denInput.disabled = true;

      addNextFractionBlock("simplify");
      return;
    }

    const elapsedSeconds = stopTimer();
    const basePts = calculateBasePoints(elapsedSeconds);
    const bonusPts = currentProblem.needsSimplification ? 2 : 0;
    const totalPts = basePts + bonusPts;
    
    score = Math.min(50, score + totalPts);

    feedback.style.color = "var(--accent)";
    
    let bonusText = bonusPts > 0 ? ` (+2 bonus points!)` : "";
    feedback.innerText = `🎉 Vault Cracked in ${elapsedSeconds}s! +${totalPts} Points${bonusText}! 🚀`;
    
    numInput.disabled = true;
    denInput.disabled = true;
    
    document.getElementById('submit-btn').style.display = "none";
    document.getElementById('score').innerText = score;
    nextStep();
  }

  function nextStep() {
    setTimeout(() => {
      currentVault++;
      if (currentVault < 5) {
        loadVault();
      } else {
        stopTimer();
        document.querySelector('.game-container').innerHTML = `
          <h1>🎉 Heist Complete!</h1>
          <p style="font-size: 1.2rem;">Final Score: <strong>${score}</strong> / 50</p>
          <button onclick="location.reload()">Play Again</button>
        `;
      }
    }, 2000);
  }

  loadVault();
</script>

</body>
</html>
